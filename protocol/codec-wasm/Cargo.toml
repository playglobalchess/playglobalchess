[package]
name = "pgc-protocol-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "WebAssembly (wasm-pack) binding for the PlayGlobalChess wire + event codec (ADR-14, OPEN-C1=wasm DECIDED). Compiles the pure pgc-protocol codec to wasm so the web client runs the SAME encode/decode as the server and mobile (NFR-5, NFR-10) — parity by construction. The pure codec crate stays wasm-free; all binding machinery lives here. Delegate-only — no codec logic."
license = "UNLICENSED"
publish = false

[lib]
name = "pgc_protocol_wasm"
# cdylib: the wasm artifact wasm-pack emits. rlib: so `cargo test` can run the
# crate's own native unit tests (the wasm build uses only cdylib).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The pure codec — the single wire/event codec (ADR-14: one codec, many
# consumers). This crate only re-exposes it to JS/wasm; it adds no codec logic.
pgc-protocol = { path = "../codec" }
wasm-bindgen = "0.2.95"
# S4a typed message seam (SPEC-S4-WEB-F01 §3.0): converts the typed ClientMsg/
# ServerMsg (which already derive serde for the Go postcard intermediate) to/from
# plain JS objects at the boundary. The §4A FRAME bytes are still produced only
# by pgc-protocol in Rust (NFR-5) — serde-wasm-bindgen only shapes the typed
# convenience view, never the wire encoding.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# wasm-bindgen-test drives the parity test in a headless/node wasm runner.
wasm-bindgen-test = "0.3.45"
# js-sys lets the parity test build a HAND-CRAFTED JS object (via JSON.parse) —
# the shape the TS client actually constructs — and prove it encodes to the
# golden bytes, not only objects round-tripped from decode (self-bias guard).
js-sys = "0.3"
