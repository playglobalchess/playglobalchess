name: docs-check

on:
  push:
    branches: [main]
    paths: ["docs/**", "platform/ci/check_docs.py", ".github/workflows/docs-check.yml"]
  pull_request:
    paths: ["docs/**", "platform/ci/check_docs.py", ".github/workflows/docs-check.yml"]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate spec Status headers, ID references, and links
        run: python3 platform/ci/check_docs.py
