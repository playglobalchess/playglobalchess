name: docs-check

# Runs on EVERY pull request and every push to main (#117). It used to be
# path-filtered, which would leave its required status `validate-docs` pending
# forever on a code-only PR once branch protection is on. The check is a few
# seconds of Python, so the filter saved nothing worth that risk. Do not add
# `paths:` back: platform/ci/check_ci_filters.py is the audit for ci.yml only,
# and this workflow has its own test (platform/ci/test_docs_check_workflow.py).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate spec Status headers, ID references, links, and WS type codes vs the codec
        run: python3 platform/ci/check_docs.py
