name: ci

# Per-stream build/test. Each job is PATH-FILTERED and currently a STUB:
# it runs only when its folder changes, and no-ops with a clear message until
# that stream has a real build (Cargo.toml / package.json / Package.swift /
# build.gradle). This keeps a green check honest — it never implies code was
# tested when no build exists. Fill in the real steps as each stream lands.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly slow-tier run (ENGINE-CORE §8.8): the #[ignore]d deep perft corpus
    # (startpos d6, Kiwipete d5, …) — hundreds of millions of nodes, too slow
    # for the per-commit path. 03:17 UTC daily (off-peak, jittered minute).
    - cron: "17 3 * * *"

# dorny/paths-filter calls the GitHub API to list a PR's changed files, which
# needs pull-requests:read. The default GITHUB_TOKEN is otherwise minimal, so
# declare the least privilege the jobs need here.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      protocol: ${{ steps.filter.outputs.protocol }}
      services: ${{ steps.filter.outputs.services }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine: ['engine/**']
            protocol: ['protocol/**']
            services: ['services/**']
            web: ['clients/web/**']
            mobile: ['clients/ios/**', 'clients/android/**']
            platform: ['platform/**']

  engine:
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test + conformance (G-A)
        run: |
          if [ ! -f engine/Cargo.toml ]; then
            echo "::notice::engine/ has no Cargo.toml yet — stub, no build. (S1 owns G-A.)"
            exit 0
          fi
          # Real engine build. Pin the toolchain via rustup (stable) and run the
          # same gates the local engine-rust-check hook enforces: fmt, clippy
          # (warnings-as-errors, per engineering-conventions.md), tests. The test
          # suite includes this chunk's gate (FEN round-trip + perft(startpos,1)
          # == 20) and will grow into the full §8.1/§8.2 G-A corpus.
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          cargo clippy --manifest-path engine/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --all

  # Nightly ONLY (schedule event): the slow #[ignore]d perft tier (§8.8) — the
  # full §8.1 target depths (startpos d6=119,060,324; Kiwipete d5=193,690,690;
  # Positions 3–6 d5–d6). Hundreds of millions of nodes; minutes-long; never on
  # the per-commit path. Independent of `changes` because a scheduled run has no
  # PR for paths-filter to inspect.
  engine-nightly-perft:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slow perft corpus (--ignored, G-A pre-gate)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # --release so the deep perft finishes in reasonable CI time (§6.1
          # opt levels); -- --ignored runs ONLY the slow-tier corpus tests.
          cargo test --manifest-path engine/Cargo.toml --release --test perft_corpus -- --ignored --nocapture

  protocol:
    needs: changes
    if: ${{ needs.changes.outputs.protocol == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared contract (schema lint + codegen check)
        run: echo "::notice::protocol/ stub — add schema lint + client/server codegen drift check here."

  services:
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test changed services
        run: echo "::notice::services/ stub — per-service build/test (game-server, rating→G-C, anti-cheat→G-B, …)."

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint + test + i18n-guard (NFR-11)
        run: |
          if [ -f clients/web/package.json ]; then
            echo "TODO: npm ci && npm test && npm run i18n:check (no hard-coded strings)"
          else
            echo "::notice::clients/web/ has no package.json yet — stub, no build."
          fi

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test iOS/Android (shared Rust core — ADR-9)
        run: echo "::notice::clients/{ios,android}/ stub — native build + shared-core FFI tests."

  platform:
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint CI tooling
        run: python3 -c "import py_compile,glob,sys; [py_compile.compile(f,doraise=True) for f in glob.glob('platform/ci/*.py')]; print('platform/ci python compiles clean')"
