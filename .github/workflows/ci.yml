name: ci

# Per-stream build/test. Each job is PATH-FILTERED and currently a STUB:
# it runs only when its folder changes, and no-ops with a clear message until
# that stream has a real build (Cargo.toml / package.json / Package.swift /
# build.gradle). This keeps a green check honest — it never implies code was
# tested when no build exists. Fill in the real steps as each stream lands.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly slow-tier run (ENGINE-CORE §8.8): the #[ignore]d deep perft corpus
    # (startpos d6, Kiwipete d5, …) — hundreds of millions of nodes, too slow
    # for the per-commit path. 03:17 UTC daily (off-peak, jittered minute).
    - cron: "17 3 * * *"

# dorny/paths-filter calls the GitHub API to list a PR's changed files, which
# needs pull-requests:read. The default GITHUB_TOKEN is otherwise minimal, so
# declare the least privilege the jobs need here.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      protocol: ${{ steps.filter.outputs.protocol }}
      rest: ${{ steps.filter.outputs.rest }}
      services: ${{ steps.filter.outputs.services }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        # Each filter lists every path its job READS, not only the folder it owns
        # (#86, #87). A job that reads a file its filter does not match is
        # skipped on a change to that file, and its check is hollow.
        #   services: links protocol/codec-cgo + engine/engine-cgo (Makefile
        #             *_DIR), whose Cargo deps are protocol/codec + engine; the Go
        #             codec tests read protocol/vectors/.
        #   web:      depends on protocol/codec-wasm (package.json file:), which
        #             depends on protocol/codec.
        #   web-e2e:  builds both, so it runs on web, services or protocol (and,
        #             through the services filter, engine).
        #   rest:     the files platform/ci/check_rest_contract.py reads.
        #   every filter includes ci.yml, so editing a job's steps runs that job.
        # The ci-filter-audit job (unfiltered, below) DERIVES each gated job's
        # inputs from its steps and build files and fails if a filter misses one.
        with:
          filters: |
            engine: ['engine/**', '.github/workflows/ci.yml']
            protocol: ['protocol/**', 'platform/mobile/*[Cc]odec*', 'clients/ios/CodecParityTests/**', 'clients/android/codec-parity/**', '.github/workflows/ci.yml']
            rest: ['protocol/rest/**', 'docs/specs/PE-platform-eng/API-CONTRACT.md', 'docs/specs/S2-realtime/PROTOCOL.md', 'platform/ci/check_rest_contract.py', '.github/workflows/ci.yml']
            services: ['services/**', 'protocol/**', 'engine/**', '.github/workflows/ci.yml']
            web: ['clients/web/**', 'protocol/**', '.github/workflows/ci.yml']
            mobile: ['clients/ios/**', 'clients/android/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradlew', 'gradle/**', '.github/workflows/ci.yml']
            platform: ['platform/**', '.github/workflows/**']

  # Path-filter audit (#86, #87). Deliberately has NO `if:` and no `needs:`: its
  # inputs are Makefiles, Go sources, Cargo.toml files, package.json and this
  # workflow, spread across the repo, so a filtered audit would itself be a
  # hollow gate. The script also fails if this job ever gains an `if:`.
  ci-filter-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every gated job's filter covers what the job reads
        run: python3 platform/ci/check_ci_filters.py

  engine:
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test + conformance (G-A)
        run: |
          if [ ! -f engine/Cargo.toml ]; then
            echo "::notice::engine/ has no Cargo.toml yet — stub, no build. (S1 owns G-A.)"
            exit 0
          fi
          # Real engine build. Pin the toolchain via rustup (stable) and run the
          # same gates the local engine-rust-check hook enforces: fmt, clippy
          # (warnings-as-errors, per engineering-conventions.md), tests. The test
          # suite includes this chunk's gate (FEN round-trip + perft(startpos,1)
          # == 20) and will grow into the full §8.1/§8.2 G-A corpus.
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          # Default features only on the per-commit path: do NOT force `difftest`
          # (which pulls the shakmaty reference crate). The §8.7 differential tier
          # is linted + run in the nightly engine-nightly-perft job.
          cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --all
          # pgc-engine-ffi (ADR-9 UniFFI bindings, §8.8). Host build + the
          # binding-surface unit tests + the parity oracle run here; the iOS/
          # Android cross-builds + device parity run need the mobile toolchains
          # (platform/mobile/build_mobile.sh), not the per-commit path.
          cargo fmt --manifest-path engine/ffi/Cargo.toml --all -- --check
          cargo clippy --manifest-path engine/ffi/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path engine/ffi/Cargo.toml

  # Nightly ONLY (schedule event): the slow #[ignore]d perft tier (§8.8) — the
  # full §8.1 target depths (startpos d6=119,060,324; Kiwipete d5=193,690,690;
  # Positions 3–6 d5–d6). Hundreds of millions of nodes; minutes-long; never on
  # the per-commit path. Independent of `changes` because a scheduled run has no
  # PR for paths-filter to inspect.
  engine-nightly-perft:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slow perft corpus (--ignored, G-A pre-gate)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # --release so the deep perft finishes in reasonable CI time (§6.1
          # opt levels); -- --ignored runs ONLY the slow-tier corpus tests.
          cargo test --manifest-path engine/Cargo.toml --release --test perft_corpus -- --ignored --nocapture
      - name: Differential tier vs shakmaty (§8.7, dev-only)
        run: |
          # Cross-check our perft against the reference crate. --features difftest
          # pulls shakmaty ONLY here (never default / per-commit — OPEN-A).
          cargo test --manifest-path engine/Cargo.toml --release --features difftest --test differential -- --nocapture

  # Nightly ONLY: the §6.1 performance benches (NFR-1 / G-A sub-ms move gen).
  # criterion runs are seconds-long and noisy on shared runners, so they are
  # kept off the per-commit path. check_bench.py fails the job on a regression
  # past the §6.1 ceilings (legal_moves < 1 ms, is_legal < 10 µs).
  engine-perf-bench:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench + §6.1 threshold check
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo bench --manifest-path engine/Cargo.toml --bench movegen
          python3 platform/ci/check_bench.py

  protocol:
    needs: changes
    if: ${{ needs.changes.outputs.protocol == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Codec build + test (ADR-14, SPEC-S2-PROTOCOL §8)
        run: |
          if [ ! -f protocol/codec/Cargo.toml ]; then
            echo "::notice::protocol/codec has no Cargo.toml yet — stub, no build."
            exit 0
          fi
          # Real codec gate, mirroring the engine job: fmt + clippy
          # (warnings-as-errors, per engineering-conventions.md) + tests on BOTH
          # the pure codec crate and its UniFFI wrapper. This is the automated
          # guard that an edit to a §4A field / mirror type which breaks
          # round-trip or the golden-vector byte-freeze fails loudly here (the
          # golden_freeze + ffi_bytes_match_core_bytes tests), rather than
          # silently shipping an NFR-10 wire divergence.
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          # pure codec crate (pgc-protocol): round-trip + negative + golden-freeze
          # + property + ordering (SPEC-S2-PROTOCOL §8, PLAN-CODEC §5).
          cargo fmt --manifest-path protocol/codec/Cargo.toml --all -- --check
          cargo clippy --manifest-path protocol/codec/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path protocol/codec/Cargo.toml
          # UniFFI wrapper (pgc-protocol-ffi, PLAN-CODEC §4.3): the host build +
          # binding-surface unit tests + the codec parity oracle. The iOS/Android
          # cross-builds + device parity run need the mobile toolchains
          # (platform/mobile/build_codec_mobile.sh), not the per-commit path.
          cargo fmt --manifest-path protocol/codec-ffi/Cargo.toml --all -- --check
          cargo clippy --manifest-path protocol/codec-ffi/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path protocol/codec-ffi/Cargo.toml
          # cgo C-ABI wrapper (pgc-protocol-cgo, PLAN-S2-CODEC v1.1 §4.5 / ADR-15).
          # Runs the boundary unit tests + the 99,990-call ABI fuzz sweep against
          # the rlib build (the Rust-side safety leg). The staticlib+header LINK
          # proof — Go actually dlopening the .a through the C header — is the Go
          # golden-vector parity test, gated in the `services` job below.
          if [ -f protocol/codec-cgo/Cargo.toml ]; then
            cargo fmt --manifest-path protocol/codec-cgo/Cargo.toml --all -- --check
            cargo clippy --manifest-path protocol/codec-cgo/Cargo.toml --all-targets -- -D warnings
            cargo test --manifest-path protocol/codec-cgo/Cargo.toml
          fi
      - name: Node setup for the wasm parity runner
        uses: actions/setup-node@v4
        with:
          # Node 26 — the Active LTS line (LTS from 2026-10-28; pinned now to
          # avoid a second bump in two weeks). The project's Latest-LTS standard.
          node-version: "26"
      - name: Web codec wasm gate (SPEC-S4-WEB-F01 §3.0 — S4a seam + node parity)
        run: |
          # pgc-protocol-wasm (ADR-14 web consumer): fmt + clippy on the wasm
          # target, then the node parity test (`wasm-pack test --node`) that
          # replays the SHARED golden corpus through the compiled wasm codec and
          # the S4a typed message seam — the NFR-10 proof on the actually-shipped
          # web artifact. Was previously UNGATED (the protocol job built codec/
          # codec-ffi/codec-cgo but not codec-wasm); S4a wires it.
          # codec-wasm is a REAL crate (not a stub), so a missing manifest is a
          # restructure that must FAIL the gate rather than silently skip the
          # §4A parity proof — a gate that passes by finding nothing is not a
          # gate (context-free review S1).
          if [ ! -f protocol/codec-wasm/Cargo.toml ]; then
            echo "::error::protocol/codec-wasm/Cargo.toml missing — the wasm codec gate cannot run; restructure must keep it discoverable."
            exit 1
          fi
          rustup target add wasm32-unknown-unknown
          # wasm-pack drives the headless node wasm runner. Install a PINNED
          # version from crates.io (built from source, --locked) rather than a
          # curl|sh of the latest installer — reproducible + no unverified remote
          # shell in a release-gating job (context-free review S4).
          cargo install wasm-pack --version 0.13.1 --locked
          cargo fmt --manifest-path protocol/codec-wasm/Cargo.toml --all -- --check
          cargo clippy --manifest-path protocol/codec-wasm/Cargo.toml --all-targets \
            --target wasm32-unknown-unknown -- -D warnings
          # NOTE (local dev only): on the sandboxed macOS dev box, TMPDIR points
          # into $KIROCREW_SCRATCH and the node wasm runner's realpathSync EPERMs
          # there — run with TMPDIR set to a project-local dir. CI (ubuntu) is
          # unaffected, so no override is needed here.
          ( cd protocol/codec-wasm && wasm-pack test --node )

  # REST contract audit as its own job (#86). It reads two spec files under
  # docs/, so as a step inside the Rust `protocol` job a docs-only contract
  # change never ran it. Stdlib Python only, so it is cheap to run on exactly the
  # files it reads (the `rest` filter), without starting the macOS parity job.
  rest-contract:
    needs: changes
    if: ${{ needs.changes.outputs.rest == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: REST contract audit (R1 — SPEC-PE-API-CONTRACT §8 static half)
        run: |
          # Frozen REST contract (protocol/rest/openapi.yaml) vs the specs:
          # OpenAPI 3.1 validity + §3.3 WS/REST boundary + §3.2 catalog parity +
          # Appendix B error-registry parity. Stdlib-only; the server-dependent
          # §8 conformance suite (R2) ships with the F-01 slice (P1).
          # NO existence guard on purpose: the artifact is the single source of
          # truth (NFR-10), so a missing/moved/renamed openapi.yaml MUST fail the
          # gate (the script fail()s on it) rather than silently no-op the audit.
          python3 platform/ci/check_rest_contract.py

  # macOS host-provable parity tier (SPEC-S2-PROTOCOL §8, PLAN-CODEC §4.3): the
  # Swift consumer RUNS against the codec dylib and reproduces the frozen golden
  # bytes, and the Kotlin binding type-checks (kotlinc + a pinned, verified JNA).
  # Needs a mac runner for swiftc/kotlinc, so it is a SEPARATE job from the
  # ubuntu Rust gate above (which is the real regression gate). The on-device
  # Simulator/emulator runs stay manual (platform/mobile/README-codec.md) — they
  # need a booted device, which hosted runners do not provide cheaply.
  protocol-parity:
    needs: changes
    if: ${{ needs.changes.outputs.protocol == 'true' || needs.changes.outputs.mobile == 'true' }}
    runs-on: macos-latest
    # HARD GATE. The host-provable Swift-run + Kotlin-compile parity tier. Proven
    # green on hosted macOS runners (multiple runs on main + PRs, 2026-10-12), so
    # it is now blocking: a Swift/Kotlin codec-binding regression or a wire-byte
    # divergence the mobile bindings would surface fails CI here. The ubuntu
    # `protocol` job remains the primary regression gate (golden-freeze + the
    # Rust/cgo tests); this adds the cross-language-binding proof the Rust job
    # cannot reach. On-device Simulator/emulator runs stay manual (need a booted
    # device, not cheap on hosted runners).
    steps:
      - uses: actions/checkout@v4
      - name: Host-provable codec parity (Swift run + Kotlin binding compile)
        run: |
          if [ ! -f protocol/codec-ffi/Cargo.toml ]; then
            echo "::notice::protocol/codec-ffi has no Cargo.toml yet — stub, no parity."
            exit 0
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          # kotlinc for the Kotlin binding type-check; JNA is fetched + verified
          # by the script itself (pinned 5.14.0), so no primed cache is needed.
          # Retry brew once so a transient Homebrew/network blip does not flakily
          # block an unrelated protocol PR now that this is a hard gate.
          brew install kotlin >/dev/null || { sleep 10; brew install kotlin >/dev/null; }
          platform/mobile/run_codec_parity.sh

  services:
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    # DynamoDB Local backs the GS-4 event-store integration test (Q-GS4D): the
    # store's conditional-put / TransactWriteItems semantics are proven against a
    # real DynamoDB engine here, not just the in-process fake. The gated test
    # (store_local_test.go) skips when DYNAMODB_LOCAL_ENDPOINT is unset, so this
    # service only matters for the game-server store tests.
    # Redis backs the GS-5 matchmaking integration test (Q-MM5): the atomic
    # Lua claim (no double-match under concurrent seeks) is proven against a
    # real Redis. redis_integration_test.go skips when REDIS_ENDPOINT is unset.
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
      REDIS_ENDPOINT: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build + test changed services
        run: |
          # game-server (X-2, Go, ADR-12): the move/event hot path links the
          # pgc-protocol codec in-process via cgo (ADR-14/ADR-15). `make test`
          # cross-compiles protocol/codec-cgo into a staticlib and runs the Go
          # golden-vector parity test THROUGH the actual .a + C header link —
          # the Go leg of NFR-10 and the staticlib/header-drift guard that the
          # Rust-only `protocol` job cannot reach. The GS-4 store integration
          # test (store_local_test.go) additionally runs against the
          # dynamodb-local service above via DYNAMODB_LOCAL_ENDPOINT. Honest
          # stub-guard: no-op until the Go module exists.
          if [ -f services/game-server/go.mod ]; then
            rustup toolchain install stable --profile minimal
            rustup default stable
            make -C services/game-server test
          else
            echo "::notice::services/game-server has no go.mod yet — stub, no build."
          fi
          # Other services (rating→G-C, anti-cheat→G-B, …) build/test here as they land.
          # accounts (X-3, Go, SPEC-S3-ACCOUNTS): PURE Go (no cgo — the move hot
          # path / rules engine do not live here), so no `make lib` step. Honest
          # stub-guard: no-op until the Go module exists.
          if [ -f services/accounts/go.mod ]; then
            make -C services/accounts vet
            make -C services/accounts test
          else
            echo "::notice::services/accounts has no go.mod yet — stub, no build."
          fi

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (wasm target) for the shared §4A codec
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          # PINNED wasm-pack from source (--locked), not a curl|sh installer —
          # reproducible, no unverified remote shell in a gating job.
          cargo install wasm-pack --version 0.13.1 --locked
      - uses: actions/setup-node@v4
        with:
          # Node 26 — the project's Latest-LTS standard (web/CI).
          node-version: "26"
      - name: Build the shared codec wasm pkg (NFR-5 — client binds, never re-impls)
        run: |
          # The client imports pgc-protocol-wasm from this built pkg. Build it the
          # same way `npm run codec:build` does, so typecheck/test see the real
          # codec surface rather than a stale/absent artifact.
          wasm-pack build protocol/codec-wasm --target bundler --out-dir pkg
      - name: Install, typecheck, lint, test, i18n (NFR-8 axe + NFR-11)
        working-directory: clients/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          # `npm test` runs the vitest unit suite INCLUDING the automated
          # axe-core accessibility check on the Board (NFR-8) and the reducer /
          # GameSocket / hook unit tests. The real-server e2e is a SEPARATE job
          # (web-e2e) because it needs the Go server built.
          npm test
          npm run i18n:check

  web-e2e:
    needs: changes
    # The real-server e2e drives the web client against the actual Go
    # game-server, so it must run when EITHER the web client, the server, or the
    # shared codec changes — a server/codec change can break the live contract
    # the e2e proves even with no web diff. The services filter also covers
    # engine/** (the server links engine-cgo), so an engine-only change runs it.
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.services == 'true' || needs.changes.outputs.protocol == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (for cgo staticlibs + wasm codec)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Build the shared codec wasm pkg
        run: wasm-pack build protocol/codec-wasm --target bundler --out-dir pkg
      - name: Real-server end-to-end (web client ↔ Go game-server)
        working-directory: clients/web
        run: |
          # `npm run e2e` builds the Go e2e-server (make lib stages the cgo
          # staticlibs, then `go build ./cmd/e2e-server`) and runs the e2e vitest
          # config: two real GameSocket clients over Node's native WebSocket play
          # a matched game against the real server, asserting the move reaches
          # BOTH seats with the right uci (ADR-18). This is the full-stack proof
          # the fake-socket unit tests cannot give.
          npm ci
          npm run e2e

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS (shared Rust core — ADR-9)
        run: echo "::notice::clients/ios/ stub — native build + shared-core FFI tests."
      # Real Android gate: resolves the AGP/Kotlin buildscript graph and compiles
      # both parity modules, so toolchain bumps (and the Dependabot buildscript
      # constraints in build.gradle.kts) are verified by CI, not just locally.
      # Emulator/device parity stays manual (platform/mobile/README-codec.md).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Gradle build (assembleRelease, both parity modules)
        run: ./gradlew --no-daemon :engine-parity:assembleRelease :codec-parity:assembleRelease

  platform:
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint CI tooling
        run: python3 -c "import py_compile,glob,sys; [py_compile.compile(f,doraise=True) for f in glob.glob('platform/ci/*.py')]; print('platform/ci python compiles clean')"
      - name: Unit-test CI tooling
        run: python3 -m unittest discover -s platform/ci -p 'test_*.py' -v

