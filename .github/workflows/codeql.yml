name: codeql

# CodeQL code scanning (#192). Findings appear under Security > Code scanning.
# Not part of the `ci-ok` aggregate: the analysis runs for minutes and uploads
# to GitHub rather than gating on a job result. To block merges on alerts, add
# a code_scanning rule to the branch ruleset (docs/ops/BRANCH-PROTECTION.md).
# build-mode none: no compiler, so the Go service that links the Rust staticlib
# needs no `make lib` here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"   # weekly, so a new query pack scans old code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, rust, python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
